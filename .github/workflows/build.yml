name: Build LuxiOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: "Check out with tags (the version comes from git describe)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install firmtool, makerom and clang
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip clang git build-essential
          pip3 install --break-system-packages git+https://github.com/TuxSH/firmtool.git
          # The prebuilt makerom needs a newer glibc than this container has: build it from source
          git clone --depth 1 --branch makerom-v0.19.0 https://github.com/3DSGuy/Project_CTR.git /tmp/Project_CTR
          make -C /tmp/Project_CTR/makerom deps
          make -C /tmp/Project_CTR/makerom -j"$(nproc)"
          install -m 755 "$(find /tmp/Project_CTR/makerom -type f -name makerom -perm -u+x | head -n 1)" /usr/local/bin/makerom
          makerom 2>&1 | head -n 1

      - name: Build boot.firm
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make -j"$(nproc)"

      - name: Host tests
        run: |
          failed=0
          for t in luxios-tools/tests/run_*_test.sh; do
            echo "== $t"
            bash "$t" || failed=1
          done
          exit $failed

      - name: Upload boot.firm
        uses: actions/upload-artifact@v4
        with:
          name: LuxiOS-boot.firm
          path: boot.firm
